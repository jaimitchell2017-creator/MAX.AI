# .github/workflows/build-engine.yml
name: Build GGUF browser engine

on:
  workflow_dispatch: # you trigger this manually from the Actions tab
  push:
    branches: [ main ] # optional: also build on pushes to main

jobs:
  build-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Max AI repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build

      - name: Clone llama-cpp-wasm engine
        run: |
          git clone https://github.com/tangledgroup/llama-cpp-wasm.git
          ls llama-cpp-wasm

      - name: Build single-thread WebAssembly engine
        working-directory: llama-cpp-wasm
        run: |
          chmod +x build-single-thread.sh
          ./build-single-thread.sh

      - name: Copy dist/llama-st into engine/llama
        run: |
          mkdir -p engine/llama
          cp -rv llama-cpp-wasm/dist/llama-st/* engine/llama/

      - name: Upload engine files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-engine
          path: engine/llama
